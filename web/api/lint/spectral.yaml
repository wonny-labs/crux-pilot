# Rules for web/api/openapi.yaml. scripts/check-management-api.sh fails on any warning.
extends:
  - [spectral:oas, all]
rules:
  # The project publishes no contact address.
  contact-properties: off
  crux-methods:
    description: |
      A path holds only GET, PUT, POST and DELETE. The other rules cover these four, so any other method is
      rejected until they cover it too.
    severity: error
    given: $.paths[*]
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          additionalProperties: false
          patternProperties:
            '^x-': {}
          properties:
            get: {}
            put: {}
            post: {}
            delete: {}
            parameters: {}
            summary: {}
            description: {}
  crux-access-class:
    description: Every operation states its access class, as a route must in the web contract.
    message: 'x-crux-access must be public, session or a permission name: {{error}}'
    severity: error
    given: $.paths[*][get,put,post,delete]
    then:
      field: x-crux-access
      function: pattern
      functionOptions:
        match: '^(public|session|[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+)$'
  crux-access-class-present:
    description: Every operation states its access class.
    severity: error
    given: $.paths[*][get,put,post,delete]
    then:
      field: x-crux-access
      function: truthy
  crux-security-declared:
    description: Every operation declares its security, so that public is never the default.
    severity: error
    given: $.paths[*][get,put,post,delete]
    then:
      field: security
      function: defined
  crux-public-has-no-security:
    description: A public operation asks for no session.
    severity: error
    given: $.paths[*][?(@['x-crux-access'] === 'public')]
    then:
      field: security
      function: length
      functionOptions:
        max: 0
  crux-session-security-not-empty:
    description: An operation that is not public has at least one security requirement.
    severity: error
    given: $.paths[*][?(@['x-crux-access'] && @['x-crux-access'] !== 'public')]
    then:
      field: security
      function: length
      functionOptions:
        min: 1
  crux-security-needs-session-cookie:
    description: Every security requirement of an operation that is not public includes the session cookie.
    severity: error
    given: $.paths[*][?(@['x-crux-access'] !== 'public')].security[*]
    then:
      field: sessionCookie
      function: defined
  crux-session-routes-have-401:
    description: An operation that needs a session documents 401.
    severity: error
    given: $.paths[*][?(@['x-crux-access'] && @['x-crux-access'] !== 'public')].responses
    then:
      field: '401'
      function: truthy
  crux-permission-routes-have-403:
    description: An operation that needs a fixed permission documents 403.
    severity: error
    given: $.paths[*][?(@['x-crux-access'] && @['x-crux-access'] !== 'public' && @['x-crux-access'] !== 'session')].responses
    then:
      field: '403'
      function: truthy
  crux-state-change-has-403:
    description: A state-changing operation documents 403, because its CSRF token or Origin can be rejected.
    severity: error
    given: $.paths[*][put,post,delete].responses
    then:
      field: '403'
      function: truthy
  crux-state-change-needs-csrf:
    description: A state-changing operation with a session requires the X-XSRF-TOKEN header.
    severity: error
    given: $.paths[*][put,post,delete][?(@property === 'security' && @.length > 0)][*]
    then:
      field: xsrfHeader
      function: defined
  crux-read-has-no-csrf:
    description: A GET changes no state, so it does not ask for the CSRF token.
    severity: error
    given: $.paths[*].get.security[*]
    then:
      field: xsrfHeader
      function: undefined
  crux-busy-409:
    description: Every operation can answer busy, because the server holds one request per registered resource.
    severity: error
    given: $.paths[*][get,put,post,delete].responses
    then:
      field: '409'
      function: truthy
  crux-busy-409-no-body:
    description: A 409 has no JSON body, which is what tells a client that the registered path is busy.
    severity: error
    given: $.paths[*][get,put,post,delete].responses['409']
    then:
      field: content
      function: undefined
  crux-no-chunked-forbidden-status:
    description: |
      The HTTP server sends a dynamic response to an HTTP/1.1 client with chunked encoding, and RFC 9112
      forbids that on 204 and 1xx. Such a status cannot be served.
    severity: error
    given: $.paths[*][get,put,post,delete].responses
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          propertyNames:
            not:
              pattern: '^(1[0-9][0-9]|204)$'
  crux-unavailable-503:
    description: Every route can answer 503.
    severity: error
    given: $.paths[*][get,put,post,delete].responses
    then:
      field: '503'
      function: truthy
  crux-retry-after:
    description: A 429 or 503 states how long to wait.
    severity: error
    given: $.paths[*][get,put,post,delete].responses[?(@property === '429' || @property === '503')]
    then:
      field: headers.Retry-After
      function: truthy
  crux-login-503-busy-only:
    description: |
      A public route's 503 is JSON and narrows the code to busy, in the allOf form. A plain Error would allow
      not_ready, which would reveal the credential store's state before login.
    severity: error
    given: $.paths[*][?(@['x-crux-access'] === 'public')].responses['503']
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [content]
          properties:
            content:
              type: object
              required: [application/json]
              properties:
                application/json:
                  type: object
                  required: [schema]
                  properties:
                    schema:
                      type: object
                      required: [allOf]
                      properties:
                        allOf:
                          type: array
                          minItems: 2
                          maxItems: 2
                          items:
                            - type: object
                            - type: object
                              required: [properties]
                              properties:
                                properties:
                                  type: object
                                  required: [code]
                                  properties:
                                    code:
                                      type: object
                                      required: [enum]
                                      properties:
                                        enum:
                                          const: [busy]
  crux-public-read-needs-request-header:
    description: |
      A public GET can set cookies with no session or Origin to check, so it requires X-Crux-Request: 1 and
      documents the 403 for a request without it.
    severity: error
    given: $.paths[*][?(@property === 'get' && @['x-crux-access'] === 'public')]
    then:
      - field: parameters
        function: schema
        functionOptions:
          schema:
            type: array
            contains:
              type: object
              required: [name, in, required, schema]
              properties:
                name:
                  const: X-Crux-Request
                in:
                  const: header
                required:
                  const: true
                schema:
                  type: object
                  required: [enum]
                  properties:
                    enum:
                      const: ['1']
      - field: responses.403
        function: truthy
  crux-json-has-named-examples:
    description: Every JSON body has named examples, so that a mock server can serve it.
    severity: error
    given:
      - $.paths[*][get,put,post,delete].responses[*].content[*]
      - $.paths[*][get,put,post,delete].requestBody.content[*]
    then:
      field: examples
      function: truthy
  crux-json-only:
    description: Bodies are JSON and nothing else.
    severity: error
    given:
      - $.paths[*][get,put,post,delete].responses[*].content
      - $.paths[*][get,put,post,delete].requestBody.content
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          additionalProperties: false
          properties:
            application/json:
              type: object
