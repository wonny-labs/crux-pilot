# Settings every Crux image with the wolfSSH provider needs. They use the module's Kconfig options, so
# a TLS socket backend in the same image keeps working: it rejects CONFIG_WOLFSSL_SETTINGS_FILE.
CONFIG_WOLFSSH=y
CONFIG_WOLFSSH_SETTINGS_FILE="crux_wolfssh_settings.h"
CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_CURVE25519=y
CONFIG_ENTROPY_GENERATOR=y
