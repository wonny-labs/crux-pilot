# Optional fragment for scripts/build-debug-target.sh --debug-optimizations.
# It lowers the compiler optimisation to -Og so that a debugger can step and show locals.
# A build with it is for debugging only. Its stack use and timing may differ from the -Os
# images that the verification scripts build and have not been re-measured, so it is never
# evidence for them.
CONFIG_DEBUG_OPTIMIZATIONS=y
