            crux-pilot/build/zephyr/execution-posix-evkb/zephyr/zephyr.map
            crux-pilot/build/zephyr/execution-posix-evkb/zephyr/.config
            crux-pilot/build/evidence/evkb-build.log
            crux-pilot/build/evidence/zephyr-rom-report.log
            crux-pilot/build/evidence/zephyr-ram-report.log
            crux-pilot/build/zephyr/mimxrt1060_evk_B_qspi/zephyr/.config
            crux-pilot/build/zephyr/mimxrt1060_evk_B_qspi/zephyr/zephyr.dts
            crux-pilot/build/zephyr/mimxrt1060_evk_B_qspi/zephyr/zephyr.stat
            crux-pilot/build/zephyr/mimxrt1060_evk_B_qspi/zephyr/zephyr.map
            crux-pilot/build/zephyr/mimxrt1060_evk_B_qspi/zephyr/zephyr.elf
