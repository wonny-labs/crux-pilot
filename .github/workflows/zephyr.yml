            crux-pilot/build/zephyr/m5-integrated-evkb/zephyr/zephyr.map
            crux-pilot/build/zephyr/m5-integrated-evkb/zephyr/zephyr.elf
            crux-pilot/build/zephyr/m5-integrated-evkb/zephyr/zephyr.bin
            crux-pilot/build/system-composition/*/build.log
