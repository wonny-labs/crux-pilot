name: zephyr-software

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

# Supersede only older runs for this PR and workflow. Main/manual runs are unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Every check step names its shard. tests/build/test_zephyr_ci_shards.py keeps a
  # mistyped or missing condition from silently skipping a check.
  shard:
    name: zephyr ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [storage, controller, runtime, io]
    env:
      CRUX_WORKSPACE: ${{ github.workspace }}
      CRUX_CACHE_DIR: ${{ github.workspace }}/../crux-cache
      CRUX_PYTHON: ${{ github.workspace }}/../crux-tools/bin/python
      ZEPHYR_SDK_INSTALL_DIR: ${{ github.workspace }}/../crux-cache/sdk/zephyr-sdk-1.0.1
      CRUX_BOARD_TARGET: mimxrt1060_evk@B//qspi
    steps:
      - uses: actions/checkout@v4
        with:
          path: crux-pilot
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Mirror downloads stalled for up to ten minutes in about one job in six. apt checks
      # each cached package against the signed index, so the cache cannot change what installs.
      - name: Choose the host package cache
        id: apt_cache
        run: echo "key=zephyr-apt-ubuntu-24.04-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore downloaded host packages
        id: apt_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/crux-apt
          key: ${{ steps.apt_cache.outputs.key }}
          restore-keys: zephyr-apt-ubuntu-24.04-

      - name: Install Zephyr host packages
        run: |
          archives="$HOME/.cache/crux-apt"
          mkdir -p "$archives/partial"
          sudo apt-get update
          sudo apt-get install -y -o "Dir::Cache::archives=$archives" --no-install-recommends \
            build-essential gcc-multilib ca-certificates device-tree-compiler file gperf git \
            libmagic1 libsdl2-dev pkg-config python3-dev python3-tk wget xz-utils
          sudo apt-get autoclean -o "Dir::Cache::archives=$archives"
          sudo rm -rf "$archives/partial" "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$archives"

      - name: Save downloaded host packages
        if: steps.apt_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/crux-apt
          key: ${{ steps.apt_cache.outputs.key }}

      - name: Install pinned Python tools
        run: |
          python -m venv "$GITHUB_WORKSPACE/../crux-tools"
          "$GITHUB_WORKSPACE/../crux-tools/bin/pip" install --disable-pip-version-check \
            cmake==3.28.4 ninja==1.11.1 west==1.4.0 clang-format==18.1.8
          echo "$GITHUB_WORKSPACE/../crux-tools/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Zephyr workspace and install SDK
        working-directory: crux-pilot
        env:
          CRUX_GITHUB_TOKEN: ${{ github.token }}
        run: scripts/bootstrap-zephyr.sh --install-sdk

      - name: Check changed C patch style
        if: matrix.shard == 'storage'
        working-directory: crux-pilot
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          python3 -m unittest discover -s tests/style -p 'test_patch_style.py' -v
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ -z "$PUSH_BEFORE" || "$PUSH_BEFORE" =~ ^0+$ ]]; then
              echo "Missing previous push SHA for complete patch-style comparison." >&2
              exit 2
            fi
            if ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$PUSH_BEFORE"
            fi
            scripts/check-patch.sh "$PUSH_BEFORE" HEAD
          else
            # Pull requests use the temporary merge commit's first parent.
            # Manual runs retain an explicitly limited latest-commit check.
            scripts/check-patch.sh HEAD^ HEAD
          fi

      - name: Validate actual storage providers on simulated Flash
        if: matrix.shard == 'storage'
        working-directory: crux-pilot
        run: scripts/test-storage-simulators.sh

      - name: Compile the File RT1060 FatFs/SDHC check without hardware
        if: matrix.shard == 'storage'
        working-directory: crux-pilot
        run: scripts/test-file-rt1060-compile.sh

      # Uses the already-fetched pinned sources and host C compiler; no extra job/SDK build.
      - name: Check isolated Flash PoC fault paths
        if: matrix.shard == 'storage'
        working-directory: crux-pilot
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyr
        run: python3 tests/native/flash_safety/test_driver.py

      - name: Compare controller execution candidates without hardware
        if: matrix.shard == 'controller'
        working-directory: crux-pilot
        run: scripts/test-execution.sh

      - name: Validate the early controller without hardware
        if: matrix.shard == 'controller'
        working-directory: crux-pilot
        run: scripts/test-controller.sh

      - name: Validate portable execution without hardware
        if: matrix.shard == 'runtime'
        working-directory: crux-pilot
        run: scripts/test-portable-execution.sh

      - name: Validate Time CPU Busy-wait without hardware
        if: matrix.shard == 'runtime'
        working-directory: crux-pilot
        run: scripts/test-time-busy-wait.sh

      - name: Validate portable messaging without hardware
        if: matrix.shard == 'runtime'
        working-directory: crux-pilot
        run: |
          scripts/test-messaging.sh
          scripts/measure-messaging.sh

      - name: Validate portable Serial without hardware
        if: matrix.shard == 'io'
        working-directory: crux-pilot
        run: scripts/test-serial.sh

      - name: Validate portable GPIO without hardware
        if: matrix.shard == 'io'
        working-directory: crux-pilot
        run: scripts/test-gpio.sh

      - name: Validate portable I2C without hardware
        if: matrix.shard == 'io'
        working-directory: crux-pilot
        run: scripts/test-i2c.sh

      - name: Validate portable SPI without hardware
        if: matrix.shard == 'io'
        working-directory: crux-pilot
        run: scripts/test-spi.sh

      # Runs the consumer's own levels from a copy outside this tree: Twister, a console
      # oracle on native_sim and a controlled defect. No hardware.
      - name: Validate the out-of-tree consumer at its Zephyr levels
        if: matrix.shard == 'runtime'
        working-directory: crux-pilot
        env:
          CRUX_CONSUMER_POC_ZEPHYR_TESTS: "1"
        run: python3 -m unittest discover -s tests/build -p test_consumer_poc.py -k ConsumerZephyrLevelsTest -v

      - name: Validate controller integration (software-only)
        if: matrix.shard == 'controller'
        working-directory: crux-pilot
        run: scripts/test-controller-integration.sh

      - name: Cross-build RT1170-EVK Rev A CM7 composition (software-only)
        if: matrix.shard == 'controller'
        working-directory: crux-pilot
        run: scripts/test-m3-rt1170.sh

      - name: Qualify portable networking without hardware
        if: matrix.shard == 'io'
        working-directory: crux-pilot
        run: |
          scripts/bootstrap-networking-tests.sh
          scripts/test-networking.sh

      - name: Prepare networking physical fixture without hardware
        if: matrix.shard == 'io'
        working-directory: crux-pilot
        run: scripts/test-networking-physical.sh

      - name: Run native_sim RTC tests and build EVKB firmware
        if: matrix.shard == 'storage'
        working-directory: crux-pilot
        run: scripts/test-zephyr-time.sh "$CRUX_BOARD_TARGET"

      - name: Validate portable Logging, ownership and EVKB composition
        if: matrix.shard == 'runtime'
        working-directory: crux-pilot
        run: ./scripts/test-logging.sh

      - name: Validate portable System and EVKB composition without hardware
        if: matrix.shard == 'runtime'
        working-directory: crux-pilot
        run: ./scripts/test-system.sh

      - name: Validate integrated M5 software smoke without hardware
        if: matrix.shard == 'controller'
        working-directory: crux-pilot
        run: ./scripts/test-m5-integrated-smoke.sh

      - name: Check and build the product template without hardware
        if: matrix.shard == 'storage'
        working-directory: crux-pilot
        run: scripts/test-product-template.sh "$CRUX_BOARD_TARGET"

      # Avoid repeated glob traversals through large Twister build trees.
      - name: Collect Twister evidence
        if: always()
        shell: bash
        # Listing each file in the upload path exceeded the runner's limit on one
        # environment value, so the files are copied to one folder instead.
        run: |
          set -euo pipefail
          mkdir -p crux-pilot/build/twister-evidence
          cd crux-pilot/build
          for directory in zephyr/twister-*; do
            [ -d "$directory" ] || continue
            find "$directory" -type f \( \
              -name 'production_*.h' -o \
              -name '*.log' -o -name '*.err' -o \
              -name 'CMakeConfigureLog.yaml' -o \
              -name 'CMakeCache.txt' -o -name 'compile_commands.json' -o \
              -path '*/zephyr/.config' -o \
              -path '*/zephyr/zephyr.map' -o \
              -path '*/zephyr/zephyr.dts' \
            \) -print0
            find "$directory" -maxdepth 1 -type f \( -name '*.json' -o -name '*.xml' \) -print0
          done | LC_ALL=C sort -zu | xargs -0 -r cp --parents -t twister-evidence

      - name: Upload Zephyr reports and raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            # Keeps the original zephyr/twister-* layout under twister-evidence.
            crux-pilot/build/twister-evidence/
            # Direct cross-build outputs: do not scan every EVKB generated header tree.
            crux-pilot/build/zephyr/*/*.log
            crux-pilot/build/zephyr/*/*.err
            crux-pilot/build/zephyr/*/CMakeFiles/**/*.log
            crux-pilot/build/zephyr/*/CMakeFiles/CMakeConfigureLog.yaml
            crux-pilot/build/zephyr/*/CMakeCache.txt
            crux-pilot/build/zephyr/*/compile_commands.json
            crux-pilot/build/zephyr/*/zephyr/.config
            crux-pilot/build/zephyr/*/zephyr/zephyr.dts
            crux-pilot/build/evidence/*inputs*.json
            crux-pilot/build/system-resource-evidence/
            crux-pilot/build/system-consumer/ctest-junit.xml
            crux-pilot/build/zephyr/system-evkb/zephyr/.config
            crux-pilot/build/zephyr/system-evkb/zephyr/zephyr.dts
