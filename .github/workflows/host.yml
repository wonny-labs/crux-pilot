name: host-foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      CLANG_FORMAT: clang-format
      CRUX_CACHE_DIR: ${{ github.workspace }}/../crux-cache
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18=1:18.1.3-1ubuntu1 clang-tidy-18=1:18.1.3-1ubuntu1 ripgrep
          python3 -m venv "${RUNNER_TEMP}/crux-tools"
          "${RUNNER_TEMP}/crux-tools/bin/pip" install cmake==3.28.4 ninja==1.11.1 clang-format==18.1.8
          echo "${RUNNER_TEMP}/crux-tools/bin" >> "$GITHUB_PATH"
      - name: Configure, build, and test
        run: ./scripts/bootstrap-host.sh
      - name: Verify host checks with network dependency resolution disabled
        run: ./scripts/check-host.sh
      - name: Verify host sanitizers
        run: CRUX_HOST_PRESET=host-sanitize ./scripts/check-host.sh
      - name: Validate independent execution consumers and public boundaries
        run: ./scripts/test-portable-execution.sh --host-only
      - name: Validate independent File consumers
        run: |
          cmake -S tests/file_consumer -B build/file-consumers -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/file-consumers
          ctest --test-dir build/file-consumers --output-on-failure

      - name: Validate independent messaging consumers
        run: ./scripts/test-messaging.sh --host-only
      - name: Check build provenance safeguards
        run: python3 -m unittest discover -s tests/build -v
      - name: Check format
        run: ./scripts/check-format.sh
      - name: Analyze host sources
        run: ./scripts/analyze-host.sh
      - name: Check build boundaries
        run: ./scripts/check-dependencies.sh
      - name: Upload host test reports and raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/linux/sanitize/ctest-junit.xml
            build/linux/sanitize/Testing/Temporary/LastTest.log
            build/linux/debug/samples/controller/host/controller.log
            build/linux/debug/ctest-junit.xml
            build/linux/debug/Testing/Temporary/LastTest.log
            build/execution-firmware-host/ctest-junit.xml
            build/execution-firmware-host/consumer-boundary.json
            build/execution-firmware-host/compile_commands.json
            build/execution-runtime-host/ctest-junit.xml
            build/execution-runtime-host/compile_commands.json
            build/messaging-consumer/ctest-junit.xml
          retention-days: 14
          if-no-files-found: warn
