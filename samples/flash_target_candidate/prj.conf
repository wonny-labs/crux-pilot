CONFIG_STD_C17=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_SHELL=n
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
# Shrink this standalone composition; this does not prove master quiescence.
CONFIG_NETWORKING=n
CONFIG_ETH_DRIVER=n
CONFIG_DMA=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_WATCHDOG=n
# Normal Zephyr vectors remain separate from the temporary read-only island vectors.
CONFIG_SRAM_VECTOR_TABLE=y
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Sample-private storage composition, retained only for software inspection.
CONFIG_DEVICE_DEPS=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_NVS_SECTOR_COUNT=16
CONFIG_SETTINGS_NVS_NAME_CACHE=n
CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_NVS_LOOKUP_CACHE_SIZE=256
CONFIG_NVS_INIT_BAD_MEMORY_REGION=n
CONFIG_NVS_DATA_CRC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_NUM_FILES=8
