CONFIG_STD_C17=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_SHELL=n
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=0
# Shrink this standalone composition; this does not prove master quiescence.
CONFIG_NETWORKING=n
CONFIG_ETH_DRIVER=n
CONFIG_DMA=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_WATCHDOG=n
# A RAM vector table still contains Flash handler addresses: closure is NOT established.
CONFIG_SRAM_VECTOR_TABLE=y
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
