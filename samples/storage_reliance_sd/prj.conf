CONFIG_CRUX_PILOT_MODULE=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MAX_FILE_NAME=63
CONFIG_DISK_ACCESS=y
# The microSD disk driver on the board's own slot (disk "SD"), and not the MMC driver that the eMMC
# link check uses. The generated .config check in scripts/test-file-emmc-compile.sh is what catches
# a driver that was dropped with only a Kconfig warning.
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_IMX_USDHC=y
CONFIG_CRUX_FS_RELIANCE_EDGE=y
CONFIG_CRUX_FILE_RELIANCE_EDGE=y
# The formatter stays off: the firmware never formats the medium.
CONFIG_CRUX_FS_RELIANCE_EDGE_FORMAT=n
CONFIG_CRC=y
CONFIG_MAIN_STACK_SIZE=8192
