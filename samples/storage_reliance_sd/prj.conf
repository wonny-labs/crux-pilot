CONFIG_CRUX_PILOT_MODULE=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MAX_FILE_NAME=63
CONFIG_DISK_ACCESS=y
# The microSD disk driver on the board's own slot (disk "SD"), and not the MMC driver that the eMMC
# link check uses. An unsatisfied Kconfig dependency only warns; the guard in CMakeLists.txt stops a
# build without the driver first, and the .config assertion in scripts/test-file-emmc-compile.sh is
# the backstop.
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_IMX_USDHC=y
CONFIG_CRUX_FS_RELIANCE_EDGE=y
CONFIG_CRUX_FILE_RELIANCE_EDGE=y
# CONFIG_CRUX_FS_RELIANCE_EDGE_FORMAT is left at its default (off): only the format image sets it,
# through CONFIG_SAMPLE_RELIANCE_SD_FORMAT.
CONFIG_CRC=y
CONFIG_MAIN_STACK_SIZE=8192
