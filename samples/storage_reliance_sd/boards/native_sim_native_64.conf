# The rehearsal on native_sim: the simulator is an MMC device, so the MMC disk driver replaces the
# microSD driver of prj.conf. The correction of the cache flush is on, because the adapter's guard
# refuses Reliance Edge on an MMC disk without it.
CONFIG_DISK_DRIVER_SDMMC=n
CONFIG_IMX_USDHC=n
CONFIG_DISK_DRIVER_MMC=y
CONFIG_CRUX_MMC_CACHE_FLUSH=y
CONFIG_SD_DATA_TIMEOUT=100
# A quiet console: the runner reads every line, and the default image must print none.
CONFIG_SD_LOG_LEVEL_OFF=y
CONFIG_BOOT_BANNER=n
# The runs are not paced to the wall clock.
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n
