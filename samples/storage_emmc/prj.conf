CONFIG_CRUX_PILOT_MODULE=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MAX_FILE_NAME=63
CONFIG_DISK_ACCESS=y
# The MMC disk driver and its host: the flush option below depends on the MMC stack that this
# driver selects, so without them it would be dropped with only a Kconfig warning. The generated
# .config check in scripts/test-file-emmc-compile.sh is what catches that.
CONFIG_DISK_DRIVER_MMC=y
CONFIG_IMX_USDHC=y
CONFIG_CRUX_FS_RELIANCE_EDGE=y
CONFIG_CRUX_FILE_RELIANCE_EDGE=y
# The formatter stays off: the firmware never formats the medium.
CONFIG_CRUX_FS_RELIANCE_EDGE_FORMAT=n
# Any use of an MMC disk needs the flush, or a sync would leave data in the card's cache.
CONFIG_CRUX_MMC_CACHE_FLUSH=y
CONFIG_MAIN_STACK_SIZE=8192
