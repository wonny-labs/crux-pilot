# West manifest of a product repository. The product repository is the manifest
# repository and Crux is one of its projects (west calls this the T2 topology).
# Copy this directory, rename product-x, and see README.md.
manifest:
  version: "1.2"

  # Fetch the optional secure management stacks that Crux pins. No revision is
  # repeated here. Check their licences before you distribute a binary.
  # Crux has a second optional group, crux-reliance, for the GPLv2 Reliance Edge
  # file system source. It is off by default for the same reason, and its licence
  # needs the same check.
  #
  # group-filter: [+crux-secure-management]

  remotes:
    - name: crux
      url-base: https://github.com/wonny-labs
    # An internal remote, used by the two project examples below. Product-only
    # names and URLs stay in this file. Crux's manifest names only public modules.
    #
    # - name: acme
    #   url-base: https://git.example/scm/acme

  projects:
    # The first definition of a name wins, so an entry here beats the import.
    - name: crux-pilot
      remote: crux
      # No Crux tag exists yet, so this follows main. For a release,
      # pin a tag or SHA here and freeze the manifest. See the guide in README.md.
      revision: main
      import: true

    # Add a product-only module. west crux-pins lists it as PRODUCT.
    #
    # - name: vendor-runtime
    #   remote: acme
    #   revision: 0123456789abcdef0123456789abcdef01234567 # v1.0.0
    #   path: modules/vendor-runtime

    # Override a project that Crux pins. Repeat its path and state why: west
    # crux-pins lists OVERRIDE with this reason, or fails with MISMATCH without
    # one. The fork must contain the commit that Crux pins.
    #
    # - name: littlefs
    #   remote: acme
    #   revision: fedcba9876543210fedcba9876543210fedcba98 # v2.11.2-acme1
    #   path: modules/fs/littlefs
    #   userdata:
    #     crux-override: "fix for acme issue 123, drop when upstream has it"

  self:
    path: product-x
