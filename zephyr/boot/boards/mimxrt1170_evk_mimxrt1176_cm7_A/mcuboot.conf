# RT1170-EVK boot composition (MCUboot image). STARTING VALUES from the RT1170 design note
# "RT1170-EVK boot composition: memory-map choices", approved as recommended by the project owner
# on 15 November 2026 and to be corrected by the first CI build. They are Inference, and the
# composition is still Not verified by build. The CI step exists (runtime shard of the Zephyr
# workflow) but no build of these files has passed yet, and its first run may fail on the memory
# map. Mirrors the RT1060-EVK Rev B file of the same name.
#
# Executable RAM window defaults to zephyr,sram, which is now OCRAM2 (see mcuboot.overlay): point
# it at the whole SDRAM (64 MiB at 0x80000000), the load target of the application.
CONFIG_BOOT_IMAGE_EXECUTABLE_RAM_START=0x80000000
CONFIG_BOOT_IMAGE_EXECUTABLE_RAM_SIZE=67108864
# Share-data backend for the confirm path
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_BOOT_SHARE_DATA=y
CONFIG_BOOT_SHARE_DATA_BOOTINFO=y
CONFIG_BOOT_SHARE_BACKEND_RETENTION=y
