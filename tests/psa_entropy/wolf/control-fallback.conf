# CONTROL: no entropy driver at all, and a test random generator. Zephyr's own random subsystem does not compile
# with ENTROPY_GENERATOR on and no chosen entropy device, and ENTROPY_HAS_DRIVER depends on ENTROPY_GENERATOR, so
# this is the state in which wolfCrypt's Zephyr seed function does not read a driver: it calls sys_rand_get().
# This is what a mis-composed image would be.
CONFIG_ENTROPY_GENERATOR=n
CONFIG_XOSHIRO_RANDOM_GENERATOR=n
CONFIG_TEST_RANDOM_GENERATOR=y
