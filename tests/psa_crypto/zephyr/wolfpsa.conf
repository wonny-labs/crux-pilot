# wolfPSA on the wolfSSL module's Kconfig-driven settings. A management image cannot use
# CONFIG_WOLFSSL_SETTINGS_FILE, so this tests the same route. The wolfSSL TLS layer stays out of this
# image, because the conformance cases do not use it.
CONFIG_PSA_CRYPTO_PROVIDER_CUSTOM=y
CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_CRYPTO_ONLY=y
CONFIG_WOLFSSL_CURVE25519=y
CONFIG_ENTROPY_GENERATOR=y
