# Added after wolfpsa.conf. The wolfSSL TLS layer stays in the image, as in a management image, so the
# conformance cases also run against a wolfCrypt configured for TLS. The cases do not use TLS, and this
# has no TLS socket backend.
CONFIG_WOLFSSL_CRYPTO_ONLY=n
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
