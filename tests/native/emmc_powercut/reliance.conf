# Reliance Edge through the Crux adapter, with the default profile of zephyr/fs/reliance_edge.
# The formatter is compiled because the same program writes the baseline; a composition image has
# it off. With only an external file system, Zephyr's VFS name limit falls back to 12, below the
# profile's 63.
CONFIG_CRUX_FS_RELIANCE_EDGE=y
CONFIG_CRUX_FS_RELIANCE_EDGE_FORMAT=y
CONFIG_FILE_SYSTEM_MAX_FILE_NAME=63
