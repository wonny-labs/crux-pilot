# The Settings File backend on Reliance Edge, for the W4 workload. Added to reliance.conf:
# -DEXTRA_CONF_FILE="reliance.conf;settings.conf". The selection stages the corrected backend of
# tests/native/configuration_settings_file, which W4 exercises. A low line limit makes a save often
# compact the file, which is the sequence W4 cuts.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/MMC:/settings/cfg"
CONFIG_SETTINGS_FILE_MAX_LINES=6
CONFIG_CRUX_CONFIGURATION_SETTINGS_FILE=y
