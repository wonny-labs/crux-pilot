CONFIG_ZTEST=y
# Zephyr's errno values, not the host's: the host's equal Reliance Edge's, which would hide a
# missing translation.
CONFIG_MINIMAL_LIBC=y
CONFIG_FILE_SYSTEM=y
# The formatter is compiled for the test's own medium preparation only. The composition under test
# never calls it, and the sample's image does not compile it.
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FILE_SYSTEM_MAX_FILE_NAME=63
CONFIG_DISK_ACCESS=y
CONFIG_CRUX_FS_RELIANCE_EDGE=y
CONFIG_CRUX_FS_RELIANCE_EDGE_FORMAT=y
CONFIG_CRUX_FILE_RELIANCE_EDGE=y
# The flush option: a write is durable only after DISK_IOCTL_CTRL_SYNC reaches the cache flush.
CONFIG_CRUX_MMC_CACHE_FLUSH=y
CONFIG_SD_DATA_TIMEOUT=100
CONFIG_SD_LOG_LEVEL_OFF=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192
