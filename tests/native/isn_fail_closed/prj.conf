CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096

# The network stack as the bench image has it: IPv4, TCP, the RFC 6528 initial sequence number (Zephyr's default).
# NET_TEST and NET_TEST_PROTOCOL stay off: they make the stack skip tcp_init_isn().
CONFIG_NETWORKING=y
CONFIG_NET_L2_DUMMY=y
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_TCP_ISN_RFC6528=y
CONFIG_NET_TCP_CHECKSUM=y
CONFIG_NET_TCP_RANDOMIZED_RTO=n
CONFIG_NET_TCP_INIT_RETRANSMISSION_TIMEOUT=100
CONFIG_NET_TCP_RETRY_COUNT=2
CONFIG_NET_TCP_TIME_WAIT_DELAY=100
CONFIG_NET_MAX_CONN=8
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=3
CONFIG_NET_STATISTICS=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

# As the board: Zephyr's generator for sys_rand_get() and the hardware-device generator for sys_csrand_get(), both over
# the entropy device. The device is the test's own (src/test_entropy.c), so that a read can fail after the start.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_XOSHIRO_RANDOM_GENERATOR=y
CONFIG_CSPRNG_NEEDED=y
CONFIG_HARDWARE_DEVICE_CS_GENERATOR=y

# The hash of the sequence number is a PSA hash, as on the board.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_PROVIDER_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_LEGACY_RNG=y
CONFIG_MBEDTLS_PSA_DRIVER_GET_ENTROPY=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=60000
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
