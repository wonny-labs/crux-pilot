# Read after ../prj.conf, the services image's settings. Each difference is declared (Issue #220).
#
# A port of its own, so that a run of the services image beside it cannot answer in its place.
CONFIG_CRUX_WEB_PORT=18220
# The default response deadline, 3,000 ms, in place of the services image's 1,500. The packaged Angular
# example's script is larger than the 49,152 bytes that 1,500 ms allows at the declared client rate,
# and fits the 98,304 bytes of the default. See docs/e2e-native-220.md.
CONFIG_CRUX_WEB_RESPONSE_DEADLINE_MS=3000
