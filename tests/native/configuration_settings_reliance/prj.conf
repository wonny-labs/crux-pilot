CONFIG_ZTEST=y
# Zephyr's errno values, not the host's: the host's equal Reliance Edge's, which would hide a
# missing translation.
CONFIG_MINIMAL_LIBC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FILE_SYSTEM_MAX_FILE_NAME=63
CONFIG_DISK_ACCESS=y
CONFIG_CRUX_FS_RELIANCE_EDGE=y
# The formatter is compiled for the test's own medium preparation only.
CONFIG_CRUX_FS_RELIANCE_EDGE_FORMAT=y
CONFIG_CRUX_FILE_RELIANCE_EDGE=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/MMC:/settings/cfg"
CONFIG_SETTINGS_FILE_MAX_LINES=100
# The target provider under test, with the corrected backend that it stages.
CONFIG_CRUX_CONFIGURATION_SETTINGS_FILE=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=4096
