common:
  platform_allow:
    - native_sim/native/64
  tags:
    - logging
  timeout: 10
  harness: console
  harness_config:
    type: multi_line
    ordered: true
tests:
  crux.native.deferred_output:
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - '^DEFERRED_BEGIN$'
        - '^DEFERRED_RECORD signed=-9223372036854775807 unsigned=18446744073709551615 payload=abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz0123456789$'
        - '^DEFERRED_COMPLETE$'
  crux.native.deferred_overflow:
    extra_args:
      - CRUX_TEST_OVERFLOW=ON
    extra_configs:
      - CONFIG_LOG_BUFFER_SIZE=256
      - CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=200
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - 'messages dropped ---'
        - '^OVERFLOW_COMPLETE$'
