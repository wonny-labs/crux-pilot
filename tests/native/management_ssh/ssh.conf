# SSH beside HTTPS, on the services image (Issue #197). Test only. These are native_sim values and say
# nothing about a target: see docs/ssh-integrated-image.md.
CONFIG_CRUX_SSH=y
CONFIG_CRUX_SSH_CLI=y
CONFIG_CRUX_SSH_SFTP=y
# A port a user may bind, for OpenSSH on the host.
CONFIG_CRUX_SSH_PORT=2222
CONFIG_CRUX_SSH_MAX_CONNECTIONS=4
CONFIG_CRUX_SSH_MAX_AUTH_ATTEMPTS=3
CONFIG_CRUX_SSH_AUTH_TIMEOUT_MS=10000
CONFIG_CRUX_SSH_IO_TIMEOUT_MS=200
# Both stacks hold their allocations in one arena: wolfSSL for TLS (262144 B in the HTTPS image) and
# wolfSSH, which docs/ssh-wolf-provider.md sizes at about 180 KiB for four connections. The arena is 1 MiB
# here so that the measurement shows use and not a limit, and the document records how little the run needs.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=1048576
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
# One more listening socket and four connections, beside the HTTPS server's.
CONFIG_ZVFS_OPEN_MAX=48
CONFIG_ZVFS_POLL_MAX=24
CONFIG_NET_MAX_CONTEXTS=32
