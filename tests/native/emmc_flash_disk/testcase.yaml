common:
  platform_allow: [native_sim/native, native_sim/native/64]
  tags: [storage, crux]
  timeout: 180
tests:
  crux.emmc.flash_disk.cached: {}
  crux.emmc.flash_disk.nocache:
    extra_configs:
      - CONFIG_CRUX_EMMC_SIM_CACHE_KB=0
  crux.emmc.flash_disk.read_only:
    extra_configs:
      - CONFIG_CRUX_FLASH_DISK_READ_ONLY=y
  crux.emmc.flash_disk.flush_control:
    extra_configs:
      - CONFIG_CRUX_FLASH_DISK_FLUSH_CONTROL=y
