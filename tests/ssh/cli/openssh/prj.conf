# Shared by every build of this test image. The stacks and the arena are #192's test values. See
# docs/ssh-wolf-provider.md.
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=524288
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_POLL_MAX=8
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_SOCKETS_SOCKOPT_TLS=n
CONFIG_TLS_CREDENTIALS=n
CONFIG_MBEDTLS=n
CONFIG_CRUX_SYNC=y
CONFIG_CRUX_SYNC_MUTEX_COUNT=8
CONFIG_TEST_RANDOM_GENERATOR=y
# The command line, with the longest line above its default, so that a mismatch between the entry points
# and the CLI core would overrun a session's context here and not only in a later image.
CONFIG_CRUX_CLI=y
CONFIG_CRUX_CLI_LINE_MAX=400
CONFIG_CRUX_SERIAL=y
CONFIG_CRUX_THREAD=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
# The rule for an image with management. scripts/check-management-shell.py checks the result.
CONFIG_SHELL=n
