CONFIG_STD_C17=y
CONFIG_CRUX_CLI=y
# Above the default, so that the check can see the entry points take the CLI's own limit.
CONFIG_CRUX_CLI_LINE_MAX=400
CONFIG_CRUX_CLI_TOKENS_MAX=12
CONFIG_CRUX_SERIAL=y
CONFIG_CRUX_THREAD=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_SHELL=n
CONFIG_LOG=n
