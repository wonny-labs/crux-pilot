# The SSH test image on native_sim: wolfSSH without the TLS socket backend, on an unpatched Zephyr.
# CONFIG_POSIX_API=y fails on sys/_timeval.h with the host C library, so only the interfaces it needs.
CONFIG_POSIX_API=n
CONFIG_POSIX_TIMERS=n
CONFIG_POSIX_THREADS=n
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=n
CONFIG_TLS_CREDENTIALS=n
# OpenSSH on the host reaches the image through the native socket offload.
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n
