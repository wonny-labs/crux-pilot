# wolfSSH and the TLS socket backend together on native_sim, on a Zephyr with the socket patch.
# CONFIG_POSIX_TIMERS alone fails on union sigval, because only CONFIG_POSIX_API selects what that needs.
CONFIG_POSIX_API=n
CONFIG_POSIX_TIMERS=y
CONFIG_POSIX_THREADS=y
CONFIG_POSIX_REALTIME_SIGNALS=y
CONFIG_POSIX_SYSTEM_INTERFACES=y
