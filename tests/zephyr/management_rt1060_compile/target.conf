# RT1060-EVKB rev B bench image. Every size here is a first, unmeasured choice: the report says which.
# The bench declaration at the Kconfig level, and the test forms that it allows (Kconfig.bench). A reserved form
# (CRUX_BENCH_FILE_RAM_DISK, row C3) stays unset until its row implements it: bench_guard.cmake refuses it before that.
CONFIG_CRUX_MANAGEMENT_BENCH_IMAGE=y
CONFIG_CRUX_BENCH_TEST_HOST_KEY=y
CONFIG_CRUX_BENCH_NO_TIME_SOURCE=y
# D3, row C4: the first account from a password file outside the repository (bench_first_account.cmake).
CONFIG_CRUX_BENCH_FIRST_ACCOUNT_FILE=y

# D10: both listeners answer on the bench address only, which is the address of main.c and the declaration.
CONFIG_CRUX_WEB_BIND_ADDRESS="192.168.77.2"
CONFIG_CRUX_SSH_BIND_ADDRESS="192.168.77.2"
CONFIG_STD_C17=y
CONFIG_CRUX_PILOT_MODULE=y
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_SHELL=n

# Crux Logging, which the security events write to: the deferred UART backend on LPUART1, as
# tests/logging_consumer configures it for this board. printk goes through it, so there is one writer.
CONFIG_PRINTK=y
CONFIG_CRUX_LOGGING=y
CONFIG_SERIAL=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_OVERFLOW=n
CONFIG_LOG_BLOCK_IN_THREAD=n
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=14
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_LOG_RUNTIME_FILTERING=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_ASYNC=n
CONFIG_LOG_BACKEND_SHOW_LEVEL=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_PRINTK=y
CONFIG_STDOUT_CONSOLE=n
CONFIG_CONSOLE_HANDLER=n
CONFIG_CONSOLE_SUBSYS=n
CONFIG_EARLY_CONSOLE=n
CONFIG_BOOT_BANNER=n

# Ethernet and the TLS socket layer, as the M5 image and tests/zephyr/web_compile have them.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_SETTINGS=n
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_BUF_POOL_USAGE=y
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_NET_MAX_CONN=32
CONFIG_PHY_MONITOR_PERIOD=500
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=4
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=6
CONFIG_ZVFS_OPEN_MAX=48
CONFIG_ZVFS_POLL_MAX=24
CONFIG_ZVFS_EVENTFD=y
CONFIG_POSIX_API=y
CONFIG_POSIX_TIMERS=y
CONFIG_POSIX_THREADS=y
CONFIG_GPIO=y

# Entropy: the i.MX RT TRNG through its driver. No test generator, no fake entropy.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_HWINFO=y

# The Wolf profile's arena: TLS and SSH allocate from one C library arena, in SDRAM on this board.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=524288
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Web adapter, HTTPS only.
CONFIG_CRUX_WEB=y
# The HTTP server thread runs each TLS handshake inside accept. The static estimate of one handshake path is 4,272 B
# against the default of 4,096 B, so the owner asked for 8,192 B from the start (2026-11-08). Row C2 reads the stack
# watermark and raises it only if the measurement says so. The bench declaration pins no size.
CONFIG_HTTP_SERVER_STACK_SIZE=8192

# SSH, CLI and SFTP, with the provider sizes at their defaults.
CONFIG_CRUX_SSH=y
CONFIG_CRUX_SSH_CLI=y
CONFIG_CRUX_SSH_SFTP=y
CONFIG_CRUX_SSH_PORT=22
CONFIG_CRUX_SSH_MAX_CONNECTIONS=4

# Crux capabilities the composition links.
# No CONFIG_RTC: with it the wolfSSL Zephyr port looks up a devicetree label `rtc`, which this board does not
# have (its RTC is the snvs_rtc and counter_rtc nodes, behind the `rtc` alias), and wc_port.c does not compile.
# The wall clock is then Zephyr's realtime clock, which no source sets (D7): see the report.
CONFIG_CRUX_TIME=y
CONFIG_CRUX_THREAD=y
CONFIG_CRUX_THREAD_STACK_BYTES=8192
CONFIG_CRUX_SYNC=y
CONFIG_CRUX_SYNC_MUTEX_COUNT=16
CONFIG_CRUX_NETIF=y
CONFIG_CRUX_SYSTEM=y
CONFIG_WATCHDOG=y
CONFIG_REBOOT=y

# The File service on FatFs over the microSD card, the provider that exists for this board. There is no RAM disk
# selection yet: CRUX_FILE_FATFS_SIMULATOR depends on native_sim, and row C3 adds the one that D2 chose.
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_MAX_LFN=127
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_NUM_FILES=6
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_IMX_USDHC=y
CONFIG_CRUX_FILE_FATFS_RT1060=y
