# The SSH test image on native_sim, as in tests/zephyr/ssh_wolf_probe: wolfSSH without the TLS socket
# backend on an unpatched Zephyr, and OpenSSH on the host reaching it through the native socket offload.
CONFIG_POSIX_API=n
CONFIG_POSIX_TIMERS=n
CONFIG_POSIX_THREADS=n
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n
# Sim time must follow the wall clock, or a limit would pass in no time for a client on the host.
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
