# The wolfSSL profile, on a Zephyr with the socket patch recorded in patches/zephyr/README.md. The listener
# asks for TLS 1.3, which this backend reads as exact. See docs/https-composition.md.
CONFIG_MBEDTLS=n
CONFIG_WOLFSSL=y
CONFIG_WOLFSSL_TLS_VERSION_1_3=y
CONFIG_POSIX_API=y
CONFIG_POSIX_TIMERS=y
CONFIG_POSIX_THREADS=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=131072
