# Every worker away from its default, with both ends of the range: 0, and 14, the lowest
# application priority when CONFIG_NUM_PREEMPT_PRIORITIES is 15. src/main.c expects these numbers.
CONFIG_NUM_PREEMPT_PRIORITIES=15
CONFIG_CRUX_SECURITY_EVENT_DRAIN_PRIORITY=9
CONFIG_CRUX_REBOOT_WORKER_PRIORITY=0
CONFIG_CRUX_NETWORK_SETTINGS_WORKER_PRIORITY=10
CONFIG_CRUX_WEB_SESSION_WORKER_PRIORITY=11
CONFIG_CRUX_WEB_MANAGEMENT_WORKER_PRIORITY=14
