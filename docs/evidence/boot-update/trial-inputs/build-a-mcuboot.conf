# Trial config (issue #141, build A): MCUboot image
# Executable RAM window defaults to zephyr,sram, which is now OCRAM2: point it back at SDRAM (load target of the application).
CONFIG_BOOT_IMAGE_EXECUTABLE_RAM_START=0x80000000
CONFIG_BOOT_IMAGE_EXECUTABLE_RAM_SIZE=33554432
# Share-data backend for the confirm path
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_BOOT_SHARE_DATA=y
CONFIG_BOOT_SHARE_DATA_BOOTINFO=y
CONFIG_BOOT_SHARE_BACKEND_RETENTION=y
